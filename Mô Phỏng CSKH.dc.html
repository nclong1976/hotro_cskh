<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./cskh-store.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Be Vietnam Pro',sans-serif;background:#EEF0F4;color:#1E293B;-webkit-font-smoothing:antialiased}
a{color:#C8102E;text-decoration:none}a:hover{color:#a30c24}
@keyframes vgPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.15)}}
button:focus-visible{outline:2px solid #C8102E;outline-offset:2px}
.vg-app{height:100vh;height:100dvh}
@media (max-width:899px){
  .vg-top{padding:10px 12px!important;gap:10px!important}
  .vg-title{font-size:16px!important}
  .vg-actions{width:100%}
  .vg-step{order:3;max-width:none!important;flex:1 1 100%;min-width:0;box-sizing:border-box}
  .vg-step>span:last-child{min-width:0}
  .vg-grid{grid-template-columns:minmax(0,1fr)!important;padding:10px!important;gap:10px!important}
  .vg-route{display:none!important}
}
</style>
</helmet>
<div class="vg-app" style="display:flex;flex-direction:column;overflow:hidden">
  <div class="vg-top" style="flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 20px;background:#fff;border-bottom:1px solid #E2E8F0">
    <div style="display:flex;flex-direction:column;gap:2px">
      <span style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:#C8102E">Mô phỏng thực tế</span>
      <span class="vg-title" style="font-size:18px;font-weight:700;color:#0F172A">Khách hàng ↔ Tổng đài viên</span>
    </div>
    <div class="vg-actions" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="vg-step" style="display:flex;align-items:center;gap:8px;font-size:13px;color:#475569;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:999px;padding:6px 14px;max-width:420px">
        <span style="{{ stepDot }}"></span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ stepText }}</span>
      </span>
      <button onClick="{{ run }}" style="{{ runStyle }}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>{{ runLabel }}
      </button>
      <button onClick="{{ reset }}" style="font:inherit;font-size:13px;font-weight:600;color:#334155;background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:9px 14px;cursor:pointer;white-space:nowrap" style-hover="border-color:#C8102E;color:#C8102E">Đặt lại dữ liệu</button>
    </div>
  </div>

  <sc-if value="{{ narrow }}">
    <div style="flex:none;display:flex;gap:4px;background:#E2E8F0;border-radius:12px;padding:4px;margin:10px 10px 0">
      <sc-for list="{{ panes }}" as="p" hint-placeholder-count="2">
        <button onClick="{{ p.pick }}" style="{{ p.style }}">{{ p.label }}</button>
      </sc-for>
    </div>
  </sc-if>
  <div class="vg-grid" style="flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);gap:14px;padding:14px">
    <div style="{{ custPane }}">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px">
        <span style="font-size:13px;font-weight:700;color:#0F172A;display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:#C8102E"></span>Màn hình khách hàng</span>
        <span class="vg-route" style="font-size:12px;color:#64748B">Đăng nhập → Nhắn tin</span>
      </div>
      <div style="flex:1;min-height:0;border-radius:16px;overflow:hidden;border:1px solid #E2E8F0;background:#fff;box-shadow:0 10px 30px -10px rgba(15,23,42,.15)">
        <iframe ref="{{ custRef }}" src="./Đăng Nhập CSKH.dc.html" title="Khách hàng" style="width:100%;height:100%;border:0;display:block"></iframe>
      </div>
    </div>
    <div style="{{ adminPane }}">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px">
        <span style="font-size:13px;font-weight:700;color:#0F172A;display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:#0F172A"></span>Trang quản trị CSKH</span>
        <span class="vg-route" style="font-size:12px;color:#64748B">Nhận hỗ trợ → Trả lời</span>
      </div>
      <div style="flex:1;min-height:0;border-radius:16px;overflow:hidden;border:1px solid #E2E8F0;background:#fff;box-shadow:0 10px 30px -10px rgba(15,23,42,.15)">
        <iframe ref="{{ adminRef }}" src="./Quản Trị CSKH.dc.html" title="Quản trị" style="width:100%;height:100%;border:0;display:block"></iframe>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const CHAT = './Cổng Nhắn Tin CSKH.dc.html', LOGIN = './Đăng Nhập CSKH.dc.html', ADMIN = './Quản Trị CSKH.dc.html';
const AGENT = 'Nguyễn Thùy Linh';
const SCRIPT = [
  { who: 'customer', text: 'Chào em, xe VF 5 của mình không sạc được tại trạm V-GREEN.' },
  { who: 'accept' },
  { who: 'agent', text: 'Dạ em chào anh, em là Thùy Linh – chuyên viên CSKH VinFast. Anh cho em xin vị trí trạm sạc và mã lỗi hiển thị trên màn hình ạ.' },
  { who: 'customer', text: 'Mình đang ở trạm Vincom Thảo Điền, màn hình báo lỗi E03.' },
  { who: 'agent', text: 'Dạ lỗi E03 là do súng sạc chưa khớp hoàn toàn. Anh vui lòng rút súng sạc, đợi 30 giây rồi cắm lại giúp em ạ.' },
  { who: 'customer', text: 'Được rồi em, xe đã nhận sạc. Cảm ơn em nhiều!' },
  { who: 'agent', text: 'Cảm ơn anh đã liên hệ VinFast. Chúc anh một ngày tốt lành!' },
  { who: 'close' },
  { who: 'rate' }
];
const sleep = ms => new Promise(r => setTimeout(r, ms));

class Component extends DCLogic {
  state = { vw: 1440, pane: 'cust', running: false, step: 'Tự thao tác ở hai màn hình, hoặc bấm “Chạy kịch bản”.' };
  custRef = React.createRef();
  adminRef = React.createRef();
  runId = 0;

  componentDidMount() { this.onResize = () => { const w = window.innerWidth; if ((w < 900) !== (this.state.vw < 900)) this.setState({ vw: w }); }; this.setState({ vw: window.innerWidth }); window.addEventListener('resize', this.onResize); }
  componentWillUnmount() { this.runId++; window.removeEventListener('resize', this.onResize); }
  alive(id) { return id === this.runId; }
  focusAdmin(convId) { try { this.adminRef.current.contentWindow.postMessage({ type: 'vg-focus', id: convId }, '*'); } catch (e) {} }

  async type(convId, from, text, id) {
    const st = window.VGStore;
    st.signal({ type: 'typing', convId, from, on: true });
    await sleep(Math.min(3200, 900 + text.length * 28));
    if (!this.alive(id)) return;
    st.signal({ type: 'typing', convId, from, on: false });
    st.addMessage(convId, from === 'agent' ? { from, text, read: false } : { from, text, seen: false });
  }

  run = async () => {
    if (this.state.running) { this.runId++; this.setState({ running: false, step: 'Đã dừng kịch bản.' }); return; }
    const st = window.VGStore; if (!st) return;
    const id = ++this.runId;
    this.setState({ running: true, step: 'Khách hàng đăng nhập bằng số điện thoại…' });
    const cust = this.custRef.current;
    cust.src = LOGIN;
    await sleep(1800); if (!this.alive(id)) return;
    const convId = st.createConv({ identity: '0901 234 567', service: 'VinFast' });
    st.updateConv(convId, c => { c.asset = 'VF 5 Plus · 51K-246.80'; c.tier = 'Khách hàng VinFast'; });
    try { cust.contentWindow.sessionStorage.setItem('vg-conv-id', convId); } catch (e) {}
    cust.src = CHAT;
    await sleep(1500); if (!this.alive(id)) return;
    this.focusAdmin(convId);
    for (const s of SCRIPT) {
      if (!this.alive(id)) return;
      if (s.who === 'customer') { this.setState({ step: 'Khách hàng đang nhắn…', pane: 'cust' }); await sleep(800); await this.type(convId, 'customer', s.text, id); await sleep(1200); }
      else if (s.who === 'agent') { this.setState({ step: 'Tổng đài viên đang trả lời…', pane: 'admin' }); await sleep(900); await this.type(convId, 'agent', s.text, id); await sleep(1400); }
      else if (s.who === 'accept') {
        this.setState({ step: 'Tổng đài viên tiếp nhận yêu cầu…', pane: 'admin' }); await sleep(2200); if (!this.alive(id)) return;
        st.updateConv(convId, c => { c.status = 'active'; c.acceptedAt = Date.now(); c.agentName = AGENT; c.messages.push({ id: st.uid(), from: 'system', text: AGENT + ' đã tiếp nhận hỗ trợ', ts: Date.now() }); });
        this.focusAdmin(convId); await sleep(1000);
      }
      else if (s.who === 'close') {
        this.setState({ step: 'Tổng đài viên đóng hội thoại…', pane: 'admin' }); await sleep(1500); if (!this.alive(id)) return;
        st.updateConv(convId, c => { c.status = 'closed'; c.closedAt = Date.now(); c.messages.push({ id: st.uid(), from: 'system', text: 'Tổng đài viên đã đóng hội thoại', ts: Date.now() }); });
        this.focusAdmin(convId); await sleep(1600);
      }
      else if (s.who === 'rate') {
        this.setState({ step: 'Khách hàng đánh giá 5 sao…', pane: 'cust' }); await sleep(800); if (!this.alive(id)) return;
        st.updateConv(convId, c => { c.rating = 5; });
      }
    }
    if (this.alive(id)) this.setState({ running: false, step: 'Hoàn tất kịch bản. Có thể tự thao tác tiếp.' });
  };

  reset = () => {
    this.runId++;
    try { localStorage.removeItem('vg-cskh-store-v1'); } catch (e) {}
    try { this.custRef.current.contentWindow.sessionStorage.removeItem('vg-conv-id'); } catch (e) {}
    this.custRef.current.src = LOGIN;
    this.adminRef.current.src = ADMIN + '?r=' + Date.now();
    this.setState({ running: false, step: 'Đã đặt lại dữ liệu mẫu.' });
  };

  renderVals() {
    const r = this.state.running, narrow = this.state.vw < 900, pane = this.state.pane;
    const paneStyle = show => ({ display: show ? 'flex' : 'none', flexDirection: 'column', gap: 8, minHeight: 0 });
    return {
      narrow,
      custPane: paneStyle(!narrow || pane === 'cust'), adminPane: paneStyle(!narrow || pane === 'admin'),
      panes: [['cust', 'Khách hàng'], ['admin', 'Tổng đài viên']].map(([id, label]) => ({ label, pick: () => this.setState({ pane: id }),
        style: { flex: 1, font: 'inherit', fontSize: 13, fontWeight: 600, padding: '8px 6px', border: 'none', borderRadius: 9, cursor: 'pointer', background: pane === id ? '#fff' : 'transparent', color: pane === id ? '#C8102E' : '#475569', boxShadow: pane === id ? '0 1px 3px rgba(15,23,42,.1)' : 'none' } })),
      custRef: this.custRef, adminRef: this.adminRef,
      run: this.run, reset: this.reset,
      runLabel: r ? 'Dừng kịch bản' : 'Chạy kịch bản',
      runStyle: { font: 'inherit', fontSize: 13, fontWeight: 700, display: 'flex', alignItems: 'center', gap: 6, whiteSpace: 'nowrap', border: 'none', borderRadius: 10, padding: '9px 16px', cursor: 'pointer', color: '#fff', background: r ? '#0F172A' : '#C8102E' },
      stepText: this.state.step,
      stepDot: { width: 8, height: 8, borderRadius: '50%', flex: 'none', background: r ? '#10B981' : '#94A3B8', animation: r ? 'vgPulse 1.6s infinite' : 'none' }
    };
  }
}
</script>
</body>
</html>
